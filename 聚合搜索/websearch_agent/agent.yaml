type: agent
name: websearch_agent
description: 政策情报助手 —— 用聚合搜索工具检索最新政策与行业动态，按来源可靠性组织答案。

system_prompt: ./systemprompt.md
system_prompt_type: jinja

llm_config:
  api_type: openai_chat_completion
  model: ${env.LLM_MODEL}
  base_url: ${env.LLM_BASE_URL}
  api_key: ${env.LLM_API_KEY}
  max_tokens: 8192
  stream: True

tools:
  # 聚合搜索：一个接口，后端服务商由环境变量 SEARCH_PROVIDER 决定。
  # 密钥不在 input_schema 里，模型看不到、也编不出来——
  # 它由工具模块自己从 Runtime 环境变量 SEARCH_API_KEY 读取。
  - name: AggregatedWebSearch
    yaml_path: tools/AggregatedWebSearch.tool.yaml
    binding: custom_tools.aggregated_websearch:aggregated_websearch

# 检索型 Agent 容易陷入"再搜一次"的循环，用 max_iterations 兜底
# (真正的约束在 systemprompt 的"检索次数纪律"里)
max_iterations: 10
max_context_tokens: 128000
tool_call_mode: structured
