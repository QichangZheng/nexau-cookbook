type: agent
name: sensitive_word_agent
description: 政务咨询助手 + 敏感词内容安全护栏 — 输入 / 输出 / 工具结果三路拦截演示。

system_prompt: ./systemprompt.md
system_prompt_type: file
max_iterations: 50
tool_call_mode: structured

llm_config:
  model: ${env.LLM_MODEL}
  base_url: ${env.LLM_BASE_URL}
  api_key: ${env.LLM_API_KEY}
  api_type: openai_chat_completion
  temperature: 0.2
  stream: true

tools:
  # read_file 用于演示「工具结果拦截」：Agent 读取 materials/ 下含敏感词的材料后,
  # 中间件会在下一轮模型调用前扫描 tool result 并终止本次 run。
  - name: read_file
    yaml_path: ./tools/read_file.tool.yaml
    binding: nexau.archs.tool.builtin.file_tools:read_file

middlewares:
  # 敏感词中间件（RFC-0027）。lexicon_dir 指向 artifact 内的 lexicon/（部署后位于 /agent/lexicon）,
  # 必须写绝对路径——中间件按进程 CWD 解析相对路径。词库组织与来源见教程设计要点 3 和 lexicon/README.md。
  - import: nexau.archs.main_sub.execution.middleware.sensitive_word:SensitiveWordMiddleware
    params:
      lexicon_dir: /agent/lexicon
      case_sensitive: false      # 英文敏感词建议 false;中文不受影响
      block_input: true          # 拦用户输入（含 tool result）
      block_output: true         # 拦模型输出
      raise_on_block: false      # false=返回统一拒绝文案;true=抛 SensitiveContentBlockedError
